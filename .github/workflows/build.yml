name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
  release:
    types: [published]

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        include:
          - arch: x86
            platform: Win32
          - arch: x86_64
            platform: x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add msbuild to PATH
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if ($vsPath) {
            $msBuildPath = Get-ChildItem -Path "$vsPath\MSBuild\Current\Bin\MSBuild.exe" -ErrorAction SilentlyContinue |
                           Select-Object -First 1 -ExpandProperty Directory
            if ($msBuildPath) {
              echo "$msBuildPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              throw "MSBuild not found in VS installation"
            }
          } else {
            throw "Visual Studio installation not found"
          }

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -A ${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBuildSPEngine=OFF \
            -DBuildSPGame=OFF \
            -DBuildMPEngine=OFF \
            -DBuildMPDed=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target jampgame${{ matrix.arch == 'x86_64' && 'x86_64' || 'x86' }} -j $NUMBER_OF_PROCESSORS

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find build/Release -maxdepth 1 -name "jampgame*.dll" -exec cp {} dist/ \;
          cd dist
          7z a -r ../jaPRO-windows-${{ matrix.arch }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: jaPRO-windows-${{ matrix.arch }}
          path: jaPRO-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  create-latest:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: [windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE_COMMIT=$(gh api repos/${{ github.repository }}/releases/tags/latest \
            --jq '.target_commitish // empty' 2>/dev/null || echo "")
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true

          RELEASE_BODY="## Commits"

          if [ -n "$LATEST_RELEASE_COMMIT" ] && git rev-parse --quiet --verify "$LATEST_RELEASE_COMMIT^{commit}" >/dev/null 2>&1; then
            COMMITS=$(git log $LATEST_RELEASE_COMMIT..HEAD --pretty=format:"%h|%s|%an")
          else
            COMMITS=$(git log -5 --pretty=format:"%h|%s|%an")
          fi

          while IFS='|' read -r hash subject author; do
            if [[ $subject =~ \(#([0-9]+)\)$ ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              subject=$(echo "$subject" | sed 's/ (#[0-9]\+)$//')
              PR_LINK=" [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM})"
              RELEASE_BODY+=$'\n'"- $hash: $subject ($author)${PR_LINK}"
            else
              RELEASE_BODY+=$'\n'"- $hash: $subject ($author)"
            fi
          done <<< "$COMMITS"

          RELEASE_FILES=""
          for artifact_dir in artifacts/*/; do
            for file in "$artifact_dir"*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "$filename"
                RELEASE_FILES="$RELEASE_FILES $filename"
              fi
            done
          done

          gh release create latest \
            --title "Latest Build" \
            --notes "$RELEASE_BODY" \
            --target ${{ github.sha }} \
            $RELEASE_FILES

  create-release:
    if: github.event_name == 'release'
    needs: [windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload archives to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact_dir in artifacts/*/; do
            for file in "$artifact_dir"*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                gh release upload "${{ github.event.release.tag_name }}" \
                  "$file" \
                  --clobber \
                  --name "$filename"
              fi
            done
          done
